<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Throttle</title>
  <!-- GitHub Pages serves this file for any unknown address, at any depth, so it carries
       its own styles and icon instead of linking to assets/ with a relative path. -->
  <style>
    :root { color-scheme: light dark; --bg: #f8fafd; --ink: #0f172a; --muted: #47566b; --accent: #1d4ed8; --on: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a1020; --ink: #e9eefb; --muted: #a3b2cc; --accent: #8fb6ff; --on: #0a1020; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: var(--bg); color: var(--ink);
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    svg { width: 5rem; height: 5rem; margin: 0 auto 1.5rem; display: block; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    p { margin: 0.6rem 0 0; color: var(--muted); }
    a {
      display: inline-block; margin-top: 1.5rem; padding: 0.65rem 1.3rem; border-radius: 999px;
      background: var(--accent); color: var(--on); font-weight: 600; text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #3b82f6; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#1e40af"/>
        </linearGradient>
      </defs>
      <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
      <path d="M308.9 754.1 A316 316 0 1 1 715.1 754.1" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="72" stroke-linecap="round"/>
      <path d="M308.9 754.1 A316 316 0 1 1 761.0 317.5" fill="none" stroke="#fff" stroke-width="72" stroke-linecap="round"/>
      <path d="M388 420 H636 M512 420 V646" fill="none" stroke="#fff" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>This page isn't here</h1>
    <p>The address may be mistyped, or the page has moved.</p>
    <a id="home" href="/throttle-web/">Go to the front page</a>
  </main>
  <script>
    // The site lives at /throttle-web/ on GitHub Pages, or at / on a domain of its own.
    document.getElementById("home").href =
      location.pathname.indexOf("/throttle-web/") === 0 ? "/throttle-web/" : "/";
  </script>
</body>
</html>
